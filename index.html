<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everton Archive - Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Everton Football Club Archive</h1>
        <p>Historic moments and memories</p>
    </header>
    
    <main>
        <div class="gallery">
            <!-- Photos will be displayed here -->
            <div class="photo-item">
                <img src="photos/placeholder1.jpg" alt="Everton historic moment 1">
                <p class="photo-caption">Historic moment from Everton's rich history</p>
            </div>
            <div class="photo-item">
                <img src="photos/placeholder2.jpg" alt="Everton historic moment 2">
                <p class="photo-caption">Memorable match day at Goodison Park</p>
            </div>
            <div class="photo-item">
                <img src="photos/placeholder3.jpg" alt="Everton historic moment 3">
                <p class="photo-caption">Club legends and memorable victories</p>
            </div>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2025 Everton Archive. All rights reserved.</p>
    </footer>
</body>
</html>
